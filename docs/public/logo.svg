<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Nano-App</title>
  <defs>
    <!-- One light over the whole cube: from the top left to the shade at the bottom right -->
    <linearGradient id="light" x1="80" y1="40" x2="430" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28" />
      <stop offset="0.45" stop-color="#fff" stop-opacity="0" />
      <stop offset="1" stop-color="#000" stop-opacity="0.35" />
    </linearGradient>
    <!-- Shadow C2 casts on C1, fading up from their edge -->
    <linearGradient id="c2Shadow" x1="317.9" y1="265.6" x2="325.4" y2="252.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0.65" />
      <stop offset="1" stop-color="#000" stop-opacity="0" />
    </linearGradient>
    <!-- Rounded, glossy edges, as the fillets of the 3D model -->
    <filter id="bevel" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1" specularExponent="28" lighting-color="#fff" result="spec">
        <fePointLight x="-120" y="-260" z="320" />
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="gloss" />
      <feDiffuseLighting in="blur" surfaceScale="6" diffuseConstant="1.15" lighting-color="#fff" result="diffuse">
        <feDistantLight azimuth="235" elevation="55" />
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="shaded" />
      <feComposite in="shaded" in2="gloss" operator="arithmetic" k1="0" k2="1" k3="0.4" k4="0" result="lit" />
      <feComposite in="lit" in2="SourceAlpha" operator="in" />
    </filter>
    <clipPath id="shape"><path d="M262.1 7.6 L468.3 126.6 Q474.4 130.1 474.4 137.1 L474.4 374.9 Q474.4 381.9 468.3 385.4 L262.1 504.4 Q256.0 507.9 249.9 504.4 L161.0 453.1 Q154.9 449.6 154.9 442.6 L154.9 359.8 Q154.9 352.8 161.0 356.3 L249.9 407.4 Q256.0 410.9 262.1 407.4 L386.8 335.6 Q390.6 333.4 386.8 331.2 L386.0 330.8 Q382.2 328.6 382.2 324.2 L382.2 187.8 Q382.2 183.4 386.0 181.2 L386.8 180.7 Q390.6 178.5 386.8 176.3 L262.1 104.6 Q256.0 101.1 249.9 104.6 L127.5 175.0 Q121.4 178.5 127.5 182.0 L249.9 252.5 Q256.0 256.0 262.1 252.5 L266.6 249.9 Q272.7 246.4 266.6 242.9 L178.1 191.7 Q172.0 188.2 178.1 184.7 L249.9 143.3 Q256.0 139.8 262.1 143.3 L351.0 194.4 Q357.1 197.9 357.1 204.9 L357.1 307.1 Q357.1 314.1 351.0 317.6 L262.1 368.6 Q256.0 372.1 249.9 368.6 L127.5 298.2 Q121.4 294.7 121.4 301.7 L121.4 423.3 Q121.4 430.3 115.3 426.8 L43.7 385.4 Q37.6 381.9 37.6 374.9 L37.6 137.1 Q37.6 130.1 43.7 126.6 L249.9 7.6 Q256.0 4.1 262.1 7.6Z" /></clipPath>
  </defs>
  <g>
    <g filter="url(#bevel)">
      <g clip-path="url(#shape)">
        <!-- One green on the left, one black on the right -->
        <rect x="0" y="0" width="256" height="512" fill="#2f7d08" />
        <rect x="256" y="0" width="256" height="512" fill="#191816" />
        <path d="M256 139.8 L357.1 197.9 L357.1 314.1 L256 372.1 V256 L272.7 246.4 L172 188.2Z" fill="#191816" />
        <rect width="512" height="512" fill="url(#light)" />
        <!-- Shadow of C2 on C1 -->
        <polygon points="278.7,243 357.1,288.2 364.6,275.2 286.2,230" fill="url(#c2Shadow)" />
        <!-- Edges between faces, as in the original: a shade and a light beside it -->
        <g fill="none" stroke-width="2">
          <path d="M30 125.7 L121.4 178.5 M30 241.9 L121.4 294.7 M256 0 V139.8 M256 256 V512 M390.6 178.5 L482 125.7 M390.6 333.4 L482 386.3" stroke="#000" stroke-opacity="0.3" />
          <path d="M30 128.2 L121.4 181 M30 244.4 L121.4 297.2 M390.6 335.9 L482 388.8" stroke="#fff" stroke-opacity="0.18" />
        </g>
      </g>
    </g>
    <!-- C2 rises over C1 and covers its lower edge -->
    <g filter="url(#bevel)">
      <path d="M262.1 252.5 L272.6 246.5 Q278.7 243.0 284.8 246.5 L351.0 284.7 Q357.1 288.2 357.1 295.2 L357.1 307.1 Q357.1 314.1 351.0 317.6 L262.1 368.6 Q256.0 372.1 256.0 365.1 L256.0 263.0 Q256.0 256.0 262.1 252.5Z" fill="#191816" />
      <path d="M262.1 252.5 L272.6 246.5 Q278.7 243.0 284.8 246.5 L351.0 284.7 Q357.1 288.2 357.1 295.2 L357.1 307.1 Q357.1 314.1 351.0 317.6 L262.1 368.6 Q256.0 372.1 256.0 365.1 L256.0 263.0 Q256.0 256.0 262.1 252.5Z" fill="url(#light)" />
    </g>
  </g>
</svg>
