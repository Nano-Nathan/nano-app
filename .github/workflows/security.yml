# Checks the dependencies of every pull request to main or to a feature branch:
# - `dependency-review`: fails if the pull request adds a dependency with a high or critical advisory.
# - `audit`: fails if any runtime dependency of the lockfile has a high or critical advisory.
name: Security

on:
  pull_request:
    branches: [main, 'feat/**']

permissions:
  contents: read

# A new push to a pull request cancels its run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Reads only the lockfile: no install
      - run: pnpm audit --prod --audit-level high
